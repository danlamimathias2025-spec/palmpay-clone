name: Build Android APK (Free & Unlimited Lifetime)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub UI / mobile phone

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies & Cordova
        run: |
          npm ci || npm install
          npm install -g cordova

      - name: Build Web Application
        run: npm run build:cordova

      - name: Add Android Platform
        run: cordova platform add android@13.0.0

      - name: Add Native Cordova Plugins
        run: |
          cordova plugin add cordova-plugin-statusbar
          cordova plugin add cordova-plugin-splashscreen
          cordova plugin add cordova-plugin-whitelist
          cordova plugin add cordova-plugin-fingerprint-aio
          cordova plugin add cordova-plugin-vibration

      - name: Build Android Debug APK
        run: cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PalmPay-Android-APK
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
