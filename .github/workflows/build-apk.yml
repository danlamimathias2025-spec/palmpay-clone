name: Build Android APK (Free & Unlimited Lifetime)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          echo "Accepting Android SDK licenses..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install NPM Dependencies & Build Web Bundle
        run: |
          npm install
          npm install -g cordova
          npm run build:cordova

      - name: Add Android Platform & Plugins
        run: |
          cordova telemetry off
          cordova platform add android@12.0.1 --no-telemetry || cordova platform add android --no-telemetry
          cordova plugin add cordova-plugin-statusbar --no-telemetry || true
          cordova plugin add cordova-plugin-splashscreen --no-telemetry || true
          cordova plugin add cordova-plugin-fingerprint-aio --no-telemetry || true
          cordova plugin add cordova-plugin-vibration --no-telemetry || true

      - name: Build Android Debug APK
        run: |
          cordova build android --debug --no-telemetry

      - name: Locate and Stage Generated APK
        run: |
          mkdir -p apk-output
          find platforms/android -name "*.apk" -type f -exec cp {} apk-output/PalmPay.apk \;
          ls -la apk-output/

      - name: Upload APK Artifact (Direct Download on Phone)
        uses: actions/upload-artifact@v4
        with:
          name: PalmPay-Android-APK
          path: apk-output/PalmPay.apk
          retention-days: 90
