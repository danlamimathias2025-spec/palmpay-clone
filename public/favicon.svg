<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background Purple matching PalmPay -->
  <rect width="512" height="512" rx="108" fill="#6c1cf5"/>
  
  <!-- Centered PalmPay White Rounded Hexagon -->
  <g transform="translate(256, 256)">
    <!-- White Hexagon Base with rounded corners -->
    <path d="M 0 -185 
             C 18 -185, 34 -176, 43 -160 
             L 142 8 
             C 151 24, 151 43, 142 59 
             L 43 227 
             C 34 243, 18 252, 0 252 
             C -18 252, -34 243, -43 227 
             L -142 59 
             C -151 43, -151 24, -142 8 
             L -43 -160 
             C -34 -176, -18 -185, 0 -185 Z" 
          fill="#ffffff" 
          transform="scale(1.05)"/>
          
    <!-- Inner PalmPay Interlocking Emblem in Purple -->
    <g fill="#6c1cf5">
      <!-- Upper hook / loop -->
      <path d="M -68 -15 
               L 42 -125 
               C 56 -139, 78 -139, 92 -125 
               L 112 -105 
               C 126 -91, 126 -69, 112 -55 
               L 35 22 
               L -5 62 
               L -45 22 
               L 32 -55 
               L 52 -75 
               L 2 -125 
               L -68 -55 
               Z"/>

      <!-- Lower hook / loop -->
      <path d="M 68 85 
               L -42 195 
               C -56 209, -78 209, -92 195 
               L -112 175 
               C -126 161, -126 139, -112 125 
               L -35 48 
               L 5 8 
               L 45 48 
               L -32 125 
               L -52 145 
               L -2 195 
               L 68 125 
               Z"/>

      <!-- Central Diamond -->
      <polygon points="0,5 28,33 0,61 -28,33" fill="#6c1cf5"/>
    </g>
  </g>
</svg>
