<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>PalmPay - Simple, Fast, Secure</title>
    <meta name="description" content="Experience seamless mobile payments, transfers, high-yield savings, and bill payments with PalmPay." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Comfortaa:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Itim&display=swap" rel="stylesheet" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#6c1cf5" />

    <style>
      /* Instant Zero-Dependency Offline Splash Screen */
      #palmpay-splash {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #151618;
        color: #ffffff;
        padding: 24px;
        transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.35s;
        will-change: opacity, visibility;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      .palmpay-splash-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        animation: palmpay-splash-scale 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .palmpay-splash-brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .palmpay-splash-logo {
        width: 36px;
        height: 36px;
        flex-shrink: 0;
      }
      .palmpay-splash-svg {
        width: 100%;
        height: 100%;
        display: block;
        filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.3));
      }
      .palmpay-splash-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 30px;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: -0.5px;
        line-height: 1;
      }
      .palmpay-splash-tagline {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 13px;
        font-weight: 400;
        color: #cbd5e1;
        letter-spacing: 0.2px;
        margin-top: 10px;
        margin-bottom: 0;
      }
      .palmpay-splash-offline {
        margin-top: 24px;
        display: none;
        align-items: center;
        gap: 6px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 11px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.75);
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.14);
        padding: 4px 12px;
        border-radius: 9999px;
      }
      .palmpay-offline-dot {
        width: 6px;
        height: 6px;
        background-color: #10b981;
        border-radius: 50%;
        box-shadow: 0 0 6px #10b981;
      }
      @keyframes palmpay-splash-scale {
        0% {
          transform: scale(0.92);
          opacity: 0.6;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }
      .palmpay-splash-hidden {
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
      }
    </style>
  </head>
  <body class="bg-[#0b0d14] text-white antialiased overflow-x-hidden selection:bg-[#7b46f5] selection:text-white">
    <!-- Immediate Zero-Delay Offline & Online Splash Screen -->
    <div id="palmpay-splash" aria-label="PalmPay Loading Screen">
      <div class="palmpay-splash-content">
        <!-- Horizontal Lockup: Authentic White PalmPay Glyph + "PalmPay" -->
        <div class="palmpay-splash-brand">
          <div class="palmpay-splash-logo">
            <svg viewBox="0 0 48 48" class="palmpay-splash-svg">
              <!-- Outer White Base Hexagon -->
              <path
                fill="#ffffff"
                d="M21.1574,4.2617 c1.759-1.0156, 3.9262-1.0156, 5.6851,0 l12.83,7.4074 c1.759,1.0156, 2.8426,2.8925, 2.8426,4.9236 v14.8147 c0,2.0311 -1.0836,3.908 -2.8426,4.9236 l-12.83,7.4074 c-1.759,1.0156 -3.9262,1.0156 -5.6851,0 l-12.83-7.4074 c-1.759-1.0156 -2.8426-2.8925 -2.8426-4.9236 v-14.8147 c0-2.0311, 1.0836-3.908, 2.8426-4.9236 l12.83-7.4074Z"
              />
              <!-- Inner Cutouts in Background Color -->
              <g stroke="#151618" stroke-width="3.4" fill="none" stroke-linejoin="round" stroke-linecap="round">
                <path d="M5.5645,29.8801 L23.0057,12.4388 c.4851-.4853, 1.2688-.4945, 1.7653-.0208 l7.4316,7.0885" />
                <path d="M42.4482,18.6101 l-17.4414,17.4413 c-.4851.4851, -1.2688.4944, -1.7653.0208 l-7.4316-7.0886" />
              </g>
              <!-- Central Diamond -->
              <rect
                fill="#151618"
                x="21.4733"
                y="21.4733"
                width="5.0535"
                height="5.0535"
                rx=".6317"
                ry=".6317"
                transform="translate(-9.9411 24) rotate(-45)"
              />
            </svg>
          </div>

          <span class="palmpay-splash-title">PalmPay</span>
        </div>

        <p class="palmpay-splash-tagline">The Smarter Way to Bank</p>

        <!-- Subtle indicator if user launches while offline -->
        <div id="palmpay-offline-indicator" class="palmpay-splash-offline">
          <span class="palmpay-offline-dot"></span>
          <span>Offline Ready</span>
        </div>
      </div>
    </div>

    <script>
      // Display offline badge immediately if disconnected
      if (!navigator.onLine) {
        var offEl = document.getElementById('palmpay-offline-indicator');
        if (offEl) offEl.style.display = 'inline-flex';
      }
      window.addEventListener('offline', function () {
        var offEl = document.getElementById('palmpay-offline-indicator');
        if (offEl) offEl.style.display = 'inline-flex';
      });
      window.addEventListener('online', function () {
        var offEl = document.getElementById('palmpay-offline-indicator');
        if (offEl) offEl.style.display = 'none';
      });

      // Global dismiss handler called seamlessly when React application is ready
      window.dismissOfflineSplash = function () {
        var splash = document.getElementById('palmpay-splash');
        if (splash && !splash.classList.contains('palmpay-splash-hidden')) {
          splash.classList.add('palmpay-splash-hidden');
          setTimeout(function () {
            if (splash && splash.parentNode) {
              splash.parentNode.removeChild(splash);
            }
          }, 380);
        }
      };

      // Service Worker Immediate Registration for 100% Offline Resilience
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function (e) {
            console.warn('SW registration warning:', e);
          });
        });
      }

      // Cordova Native Android Bridge Loader (only when packaged inside APK)
      if (window.location.protocol === 'file:' || window.cordova || /cordova/i.test(navigator.userAgent)) {
        var cdv = document.createElement('script');
        cdv.src = 'cordova.js';
        cdv.onerror = function() {};
        document.head.appendChild(cdv);
      }
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
