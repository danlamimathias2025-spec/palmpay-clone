name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Setup and Initialize Capacitor Android Project
        run: |
          # If gradlew does not exist in android folder, recreate android platform freshly
          if [ ! -f "android/gradlew" ]; then
            echo "Gradle wrapper not found. Generating fresh Capacitor Android project..."
            rm -rf android
            npx cap add android
          fi
          # Synchronize web assets and native configuration
          npx cap sync android

          # Inject official PalmPay Android launcher icons
          node scripts/generate-android-icons.js

      - name: Make Gradle Wrapper Executable
        run: |
          chmod +x android/gradlew

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk output/PalmPay-debug.apk
          else
            cp $(find android/app/build/outputs/apk -name "*.apk" | head -n 1) output/PalmPay-debug.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PalmPay-Android-APK
          path: output/PalmPay-debug.apk
          if-no-files-found: error
          retention-days: 14
