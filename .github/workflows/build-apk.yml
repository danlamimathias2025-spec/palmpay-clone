name: Build Android APK (Free & Unlimited Lifetime)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license" || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies & Build Web Assets
        run: |
          npm install
          npm run build:cordova

      - name: Build Android APK with Cordova
        run: |
          npx cordova telemetry off
          npx cordova platform add android@12.0.1 --no-telemetry || npx cordova platform add android --no-telemetry
          npx cordova plugin add cordova-plugin-statusbar --no-telemetry || true
          npx cordova plugin add cordova-plugin-splashscreen --no-telemetry || true
          npx cordova plugin add cordova-plugin-fingerprint-aio --no-telemetry || true
          npx cordova plugin add cordova-plugin-vibration --no-telemetry || true
          npx cordova build android --debug --no-telemetry

      - name: Locate and Stage Generated APK
        run: |
          mkdir -p apk-output
          find platforms/android -name "*.apk" -type f -exec cp {} apk-output/PalmPay.apk \;
          ls -la apk-output/

      - name: Upload PalmPay APK (Downloadable from GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: PalmPay-Android-APK
          path: apk-output/PalmPay.apk
          retention-days: 90
